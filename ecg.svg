<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60" role="img" aria-label="Heartbeat line">
  <style>
    .line {
      fill: none;
      stroke: #14b8a6;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: draw 4s linear infinite;
    }
    .base {
      fill: none;
      stroke: #14b8a6;
      stroke-opacity: 0.18;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @keyframes draw {
      0%   { stroke-dashoffset: 900; opacity: 1; }
      70%  { stroke-dashoffset: 0;   opacity: 1; }
      100% { stroke-dashoffset: 0;   opacity: 0; }
    }
  </style>
